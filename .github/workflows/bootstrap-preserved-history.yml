name: One-time AIEI preserved history import
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-preserved-history.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Validate original history and attach it without force
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' 'fc867923384a09af3aa7f83652aac6c8edad48f1fa8b03f532f3e9aa5805c5c3' '.aiei-bootstrap/preserved.bundle' | sha256sum --check --status
          git bundle verify .aiei-bootstrap/preserved.bundle
          git fetch .aiei-bootstrap/preserved.bundle '+refs/heads/main:refs/remotes/aiei-preserved/main'
          preserved="$(git rev-parse refs/remotes/aiei-preserved/main)"
          test "$preserved" = '564f7e3c7ff270bd0c93f78d00275b197376732d'
          git cat-file -e "$preserved:package.json"
          bootstrap="$(git rev-parse HEAD)"
          tree="$(git rev-parse "$preserved^{tree}")"
          merged="$(printf '%s\n' 'Import original AIEI commits and source' | git -c user.name='AIEI GitHub Import' -c user.email='aiei-import@users.noreply.github.com' commit-tree "$tree" -p "$bootstrap" -p "$preserved")"
          git push origin "$merged:refs/heads/main"
          printf 'Imported original commit %s as second parent of %s\n' "$preserved" "$merged"
